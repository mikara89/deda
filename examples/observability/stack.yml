version: "3.8"

networks:
  observability:
    driver: overlay

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    networks: [observability]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SERVICES: "1"
      TASKS: "1"
      NODES: "1"
      SWARM: "1"
      VERSION: "1"
      POST: "1"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  deda:
    image: ghcr.io/mikara89/deda:latest
    networks: [observability]
    environment:
      DOCKER_HOST: "http://docker-proxy:2375"
      DEDA_POLL_SECONDS: "5"
    ports:
      - target: 8080
        published: 8084
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  prometheus:
    image: prom/prometheus:v2.54.1
    networks: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - target: 9090
        published: 9091
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
