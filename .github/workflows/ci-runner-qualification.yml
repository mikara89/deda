name: CI runner release qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deterministic qualification mode
        required: true
        type: choice
        options: [fast, full]
      confirm_real_provider_tests:
        description: Must remain false; real provider qualification is operator-run only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deterministic:
    if: ${{ inputs.confirm_real_provider_tests == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Build candidate image
        run: docker build -f src/Deda.Host/Dockerfile -t deda:qualification .
      - name: Run deterministic qualification
        run: bash tests/qualification/v0.3/ci-runners/run-deterministic.sh --${{ inputs.mode }}
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.3-ci-runner-qualification
          path: tests/qualification/results/**/v0.3-ci
          if-no-files-found: ignore
