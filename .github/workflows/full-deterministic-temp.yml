name: Full deterministic qualification temp

on:
  push:
    branches:
      - agent/v0.3-hardening-deepseek

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Build candidate image
        run: docker build -f src/Deda.Host/Dockerfile -t deda:qualification .
      - name: Run full deterministic qualification
        run: DEDA_IMAGE=deda:qualification bash tests/qualification/v0.3/ci-runners/run-deterministic.sh --full
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae6567c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.3-full-deterministic-temp
          path: tests/qualification/results/**/v0.3-ci
          if-no-files-found: ignore
