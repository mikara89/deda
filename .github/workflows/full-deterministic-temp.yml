name: Full deterministic qualification temp

on:
  push:
    branches:
      - agent/v0.3-hardening-deepseek

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Build candidate image
        run: docker build -f src/Deda.Host/Dockerfile -t deda:qualification .
      - name: Run full deterministic qualification
        run: bash tests/qualification/v0.3/ci-runners/run-deterministic.sh --full
