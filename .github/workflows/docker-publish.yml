name: Build, Scan & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, and real Swarm verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Deda.sln
      - run: dotnet build Deda.sln --no-restore --configuration Release
      - run: dotnet test Deda.sln --no-build --configuration Release
      - run: bash tests/swarm/run-e2e.sh

  build:
    name: Build (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            targetrid: linux-x64
            runner: ubuntu-latest
          - platform: linux/arm64
            targetrid: linux-arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Deda.Host/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: TARGETRID=${{ matrix.targetrid }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: >-
            type=image,
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},
            push-by-digest=true,
            name-canonical=true,
            push=true
          cache-from: type=gha,scope=build-${{ matrix.targetrid }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.targetrid }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.targetrid }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  security:
    name: Scan candidate (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            targetrid: linux-x64
          - platform: linux/arm64
            targetrid: linux-arm64
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download candidate digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.targetrid }}
          path: /tmp/digest

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable candidate reference
        id: candidate
        shell: bash
        run: |
          digest_file=$(find /tmp/digest -type f -print -quit)
          test -n "$digest_file"
          digest=$(basename "$digest_file")
          test ${#digest} -eq 64
          echo "reference=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}" >> "$GITHUB_OUTPUT"

      - name: Scan candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.candidate.outputs.reference }}
          format: sarif
          output: trivy-${{ matrix.targetrid }}.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: trivy-${{ matrix.targetrid }}.sarif
          category: trivy-${{ matrix.targetrid }}

  candidate:
    name: Assemble verified multi-arch candidate
    runs-on: ubuntu-latest
    needs: [build, security]
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.candidate.outputs.reference }}

    steps:
      - name: Download verified digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create unadvertised candidate manifest
        id: candidate
        working-directory: /tmp/digests
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          candidate_tag="${image}:candidate-${GITHUB_SHA}"
          docker buildx imagetools create \
            -t "$candidate_tag" \
            $(printf "${image}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$candidate_tag" --format '{{json .Manifest}}' | jq -r '.digest')
          test -n "$digest" && test "$digest" != "null"
          echo "reference=${image}@${digest}" >> "$GITHUB_OUTPUT"

  publish:
    name: Sign and publish verified manifest
    runs-on: ubuntu-latest
    needs: candidate
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract public metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign immutable image digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERIFIED_IMAGE: ${{ needs.candidate.outputs.reference }}
        run: cosign sign --yes "$VERIFIED_IMAGE"

      - name: Publish public tags from verified digest
        env:
          VERIFIED_IMAGE: ${{ needs.candidate.outputs.reference }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$VERIFIED_IMAGE"

      - name: Verify published digest
        env:
          PUBLIC_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          VERIFIED_IMAGE: ${{ needs.candidate.outputs.reference }}
        run: |
          published_digest=$(docker buildx imagetools inspect "$PUBLIC_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          test "$published_digest" = "${VERIFIED_IMAGE#*@}"

  linux-binaries:
    name: NativeAOT ${{ matrix.rid }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish
        run: dotnet publish src/tools/Docker.Deda.Cli/Docker.Deda.Cli.csproj -c Release -r ${{ matrix.rid }} -o publish /p:PublishAot=true /p:SelfContained=true /p:StripSymbols=true
      - run: tar -C publish -czf docker-deda-${{ matrix.rid }}.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-deda-${{ matrix.rid }}
          path: docker-deda-${{ matrix.rid }}.tar.gz

  windows-binary:
    name: NativeAOT win-x64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish src/tools/Docker.Deda.Cli/Docker.Deda.Cli.csproj -c Release -r win-x64 -o publish /p:PublishAot=true /p:SelfContained=true /p:StripSymbols=true
      - shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath docker-deda-win-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-deda-win-x64
          path: docker-deda-win-x64.zip

  release:
    name: Checksums, SBOM, provenance, and GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [publish, linux-binaries, windows-binary]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: docker-deda-*
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts
          output-file: artifacts/sbom.spdx.json
          format: spdx-json
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
